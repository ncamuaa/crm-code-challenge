# "controller" service: a plain reverse proxy / load balancer that forwards
# all requests to the api (php-fpm) upstream. Kept as its own container so
# api instances can be scaled independently behind it.

upstream api_upstream {
    # docker-compose will resolve multiple replicas of "api" round-robin
    # when scaled via `docker-compose up --scale api=N`.
    server api:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass api_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.ht {
        deny all;
    }
}
